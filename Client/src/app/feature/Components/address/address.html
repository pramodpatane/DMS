<div class="card">
  <div class="card-header bg-secondary text-white" *ngIf="addressConfiguration.canHeaderView">
    <h5 class="h5 mb-0">Address Details</h5>
  </div>

  <div class="card-body">
    <form [formGroup]="addressForm">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label for="addressLine1" class="form-label">Address Line 1</label>
          <input id="addressLine1" name="addressLine1" type="text" class="form-control"
            autocomplete="address-line1" />
        </div>

        <div class="col-12 col-md-6">
          <label for="addressLine2" class="form-label">Address Line 2</label>
          <input id="addressLine2" name="addressLine2" type="text" class="form-control"
            autocomplete="address-line2" />
        </div>

        <div class="col-12 col-md-6">
          <label for="country" class="form-label">Country</label>
          <input id="country" name="country" type="text" class="form-control" autocomplete="country-name" />
        </div>

        <div class="col-12 col-md-6">
          <label for="state" class="form-label">State</label>
          <input id="state" name="state" type="text" class="form-control" autocomplete="address-level1" />
        </div>

        <div class="col-12 col-md-6">
          <label for="city" class="form-label">City</label>
          <input id="city" name="city" type="text" class="form-control" autocomplete="address-level2" />
        </div>

        <div class="col-12 col-md-6">
          <label for="pinCode" class="form-label">Pin Code</label>
          <input id="pinCode" name="pinCode" type="text" class="form-control"
            autocomplete="postal-code" inputmode="numeric" />
        </div>

        <div class="col-12 col-md-6">
          <label for="latitude" class="form-label">Latitude</label>
          <input id="latitude" name="latitude" type="number" class="form-control"
            min="-90" max="90" step="any" />
        </div>

        <div class="col-12 col-md-6">
          <label for="longitude" class="form-label">Longitude</label>
          <input id="longitude" name="longitude" type="number" class="form-control"
            min="-180" max="180" step="any" />
        </div>
      </div>
    </form>
  </div>
</div>
