<form #resetForm="ngForm" (ngSubmit)="sendResetLink()" novalidate>
  <div class="alert alert-primary d-flex align-items-start gap-3 mb-4" role="note">
    <span class="d-flex align-items-center justify-content-center rounded-circle bg-primary text-white flex-shrink-0 p-2" aria-hidden="true">
      <i class="bi bi-envelope-arrow-up"></i>
    </span>
    <p class="mb-0 small">
      Enter the email address linked to your account. We’ll send you a secure link to reset your password.
    </p>
  </div>

  <div class="mb-4">
    <label for="recovery-email" class="form-label fw-semibold">Email address</label>
    <div class="input-group">
      <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
      <input
        id="recovery-email"
        type="email"
        class="form-control"
        [(ngModel)]="useremail"
        name="useremail"
        required
        email
        autocomplete="email"
        placeholder="you@example.com"
        #emailInput="ngModel"
        [class.is-invalid]="emailInput.invalid && emailInput.touched"
        [attr.aria-invalid]="emailInput.invalid && emailInput.touched"
        aria-describedby="recovery-email-hint recovery-email-error"
      />
    </div>
    <div id="recovery-email-hint" class="form-text">Use the email address you signed up with.</div>
    <div
      *ngIf="emailInput.invalid && emailInput.touched"
      id="recovery-email-error"
      class="form-text text-danger"
      role="alert"
    >
      <span *ngIf="emailInput.errors?.['required']">Enter your email address.</span>
      <span *ngIf="emailInput.errors?.['email']">Enter a valid email address.</span>
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center gap-2" [disabled]="resetForm.invalid">
    <span>Send reset link</span>
    <i class="bi bi-arrow-right" aria-hidden="true"></i>
  </button>
</form>
